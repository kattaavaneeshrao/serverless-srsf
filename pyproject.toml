[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serverless-srsf"
version = "1.3.0"
description = "Local document security framework with seven supporting experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ssrsf = "ssrsf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
