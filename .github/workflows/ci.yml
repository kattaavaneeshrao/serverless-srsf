name: local-research-evaluation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_evidence.py
      - run: ssrsf evaluate --non-interactive --trials 30 --seed 42 --output ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: local-research-evidence
          path: ci-results/
  container-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/prototype.py init
      - run: docker compose up --build -d --wait
      - run: python scripts/prototype.py check
      - run: python scripts/prototype.py load --requests 5
      - if: failure()
        run: docker compose logs --tail 50
      - if: always()
        run: docker compose down
